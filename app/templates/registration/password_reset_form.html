{% extends 'auth_base.html' %}

{% block titulo %} Esqueceu a Senha {% endblock %}

{% block conteudo %}
    <div class="auth-container">
        <h2>Recuperar Senha</h2>

        <p>Digite seu e-mail cadastrado para receber instruções de recuperação de senha.</p>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <input type="submit" value="Enviar instruções">
        </form>

        <br>
        <a href="{% url 'login' %}">Voltar ao Login</a>
    </div>
{% endblock %}
